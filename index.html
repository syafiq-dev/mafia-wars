<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Mafia War</title>
    <link rel="icon" href="/icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; color: #fff; font: bold 20px Tahoma, sans-serif; align-items: center; justify-content: center; text-align: center; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
